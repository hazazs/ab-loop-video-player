name: Build runnable JAR

on:
  push:
    branches:
      - main
    paths:
      - "pom.xml"
      - "src/**"
      - ".github/workflows/build-runnable-jar.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ffmpeg"

          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force

          $ffmpeg = Get-ChildItem -Path $extract -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          if ($null -eq $ffmpeg) {
            throw "ffmpeg.exe was not found in the downloaded archive"
          }

          Copy-Item $ffmpeg.FullName "src/main/resources/ffmpeg.exe" -Force

      - name: Build runnable JAR
        run: mvn -B clean package

      - name: Verify runnable JAR
        shell: pwsh
        run: |
          $jar = "target/ab-loop-video-player.jar"
          if (-not (Test-Path $jar)) {
            throw "Runnable JAR was not created: $jar"
          }

          $entries = & jar tf $jar

          foreach ($required in @(
            "hu/hazazs/abplayer/AppLauncher.class",
            "hu/hazazs/abplayer/VideoLoopPlayer.class",
            "javafx/application/Application.class",
            "ffmpeg.exe"
          )) {
            if (-not ($entries -contains $required)) {
              throw "Missing required JAR entry: $required"
            }
          }

          if (-not ($entries | Where-Object { $_ -match "(?i)(glass|jfxmedia|prism_d3d).*\.dll$" })) {
            throw "Windows JavaFX native libraries were not found in the JAR"
          }

          & jar xf $jar META-INF/MANIFEST.MF
          $manifest = Get-Content "META-INF/MANIFEST.MF" -Raw
          if ($manifest -notmatch "Main-Class:\s*hu\.hazazs\.abplayer\.AppLauncher") {
            throw "Main-Class is missing or incorrect"
          }

          $jarFullPath = (Resolve-Path $jar).Path
          $verifyDir = Join-Path $env:RUNNER_TEMP "verify-bundled-ffmpeg"
          New-Item -ItemType Directory -Path $verifyDir -Force | Out-Null
          Push-Location $verifyDir
          try {
            & jar xf $jarFullPath ffmpeg.exe
            & .\ffmpeg.exe -version
            if ($LASTEXITCODE -ne 0) {
              throw "Bundled ffmpeg.exe could not be executed"
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload runnable JAR
        uses: actions/upload-artifact@v4
        with:
          name: ab-loop-video-player-runnable-jar
          path: target/ab-loop-video-player.jar
          if-no-files-found: error
